<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scorer responsive viewport fixture</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #090d14; color: #edf3fa; font-family: Arial, sans-serif; }
    body { padding: 18px; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    h1 { margin: 0; font-size: 18px; }
    p { margin: 3px 0 0; color: #9aabba; font-size: 12px; }
    output { color: #8ce0b6; font-size: 12px; font-weight: 800; }
    .stage { overflow: hidden; }
    .viewport { width: var(--viewport-width); height: var(--viewport-height); overflow: hidden; border: 0; border-radius: 8px; outline: 1px solid #41536b; background: #10131a; transform: scale(var(--viewport-scale)); transform-origin: top left; }
    iframe { width: var(--viewport-width); height: var(--viewport-height); display: block; border: 0; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1 id="fixture-title">Calificador real</h1>
      <p>Fixture LOCAL / EMULATOR. No contiene un scorer paralelo.</p>
    </div>
    <output id="fixture-status">Cargando...</output>
  </header>
  <div class="stage" id="fixture-stage">
    <div class="viewport" id="fixture-viewport">
      <iframe id="scorer-frame" title="Calificador CharroPro real"></iframe>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const width = Math.max(320, Math.min(1920, Number(params.get("w")) || 1024));
    const height = Math.max(568, Math.min(1400, Number(params.get("h")) || 768));
    const targetName = params.get("target") || "top";
    const naturalScale = Math.min(1, 900 / width, 590 / height);
    const scale = Math.max(.5, Math.floor(naturalScale * 16) / 16);
    const viewport = document.getElementById("fixture-viewport");
    const stage = document.getElementById("fixture-stage");
    const frame = document.getElementById("scorer-frame");
    const status = document.getElementById("fixture-status");
    document.documentElement.style.setProperty("--viewport-width", `${width}px`);
    document.documentElement.style.setProperty("--viewport-height", `${height}px`);
    document.documentElement.style.setProperty("--viewport-scale", String(scale));
    stage.style.width = `${width * scale}px`;
    stage.style.height = `${height * scale}px`;
    document.body.style.width = `${Math.min(964, width * scale + 36)}px`;
    document.getElementById("fixture-title").textContent = `Calificador real ${width} x ${height}`;
    const scorerUrl = `/torneo.html?tournamentId=demo-local-fmch-2026&view=scoring&charreada=demo-local-fmch-jornada-1&v=20260822-fmch-official-team-sheet-judge-review-001-v1`;
    frame.src = scorerUrl;
    frame.addEventListener("load", () => {
      window.setTimeout(async () => {
        let doc = frame.contentDocument;
        const win = frame.contentWindow;
        const clearButton = doc?.querySelector('[data-action="prepare-clear-cache"]');
        if (clearButton && !clearButton.textContent.includes("limpiada")) {
          clearButton.click();
          await new Promise((resolve) => window.setTimeout(resolve, 700));
        }
        const syncButton = doc?.querySelector('[data-action="prepare-sync"]');
        if (syncButton && !syncButton.disabled && !syncButton.textContent.includes("sincronizado")) {
          syncButton.click();
          await new Promise((resolve) => window.setTimeout(resolve, 1200));
        }
        if (!frame.contentDocument?.querySelector(".scoring-shell-classic")) {
          const loaded = new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
          frame.contentWindow.location.href = scorerUrl;
          await loaded;
          await new Promise((resolve) => window.setTimeout(resolve, 1600));
          doc = frame.contentDocument;
        }
        const shell = doc?.querySelector(".scoring-shell-classic");
        const main = doc?.querySelector(".scoring-main");
        const workspace = doc?.querySelector(".cp-scoring-main");
        const footer = doc?.querySelector(".cp-bottom-bar");
        const scrollSurface = [main, workspace].find((surface) => surface && surface.scrollHeight > surface.clientHeight);
        const targetSelectors = {
          evidence: ".time-evidence-card",
          rules: '[data-accordion="adic"] .cp-accordion-body',
          summary: ".cp-attempt-summary"
        };
        const targetSelector = targetSelectors[targetName];
        const target = targetSelector ? doc?.querySelector(targetSelector) : null;
        if (scrollSurface && target) {
          scrollSurface.scrollTop += target.getBoundingClientRect().top - scrollSurface.getBoundingClientRect().top - 8;
        }
        const measuredOverflow = Math.max(doc?.body?.scrollWidth || 0, doc?.documentElement?.scrollWidth || 0) - win.innerWidth;
        const overflow = measuredOverflow > 1 ? measuredOverflow : 0;
        const overflowNodes = [...(doc?.querySelectorAll("*") || [])]
          .map((element) => ({ element, rect: element.getBoundingClientRect() }))
          .filter(({ rect }) => rect.right > win.innerWidth + 1 || rect.left < -1)
          .slice(0, 5)
          .map(({ element, rect }) => `${element.tagName.toLowerCase()}.${element.className || ""}@${rect.left.toFixed(1)}:${rect.right.toFixed(1)}`);
        const result = {
          width: win.innerWidth,
          height: win.innerHeight,
          horizontalOverflow: Math.max(0, overflow),
          verticalScroll: [main, workspace].some((surface) => surface && surface.scrollHeight > surface.clientHeight),
          footerVisible: Boolean(footer && footer.getBoundingClientRect().bottom <= win.innerHeight + 1),
          ruleCount: doc?.querySelectorAll(".cp-scoring-action-button").length || 0,
          rootCount: shell ? 1 : 0,
          target: targetName,
          overflowNodes: overflowNodes.join("|") || "none"
        };
        window.scorerResponsiveEvidence = result;
        for (const [key, value] of Object.entries(result)) {
          document.body.dataset[key] = String(value);
        }
        status.value = `${result.horizontalOverflow === 0 ? "Sin overflow horizontal" : "Overflow"} / ${result.ruleCount} reglas / footer ${result.footerVisible ? "visible" : "oculto"}`;
        document.body.dataset.validation = result.horizontalOverflow === 0 && result.footerVisible ? "pass" : "fail";
      }, 1600);
    }, { once: true });
  </script>
</body>
</html>
