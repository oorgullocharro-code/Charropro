<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Negative timer responsive fixture</title>
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    body { margin: 0; padding: 12px; background: #05070b; }
    .fixture-grid { display: grid; gap: 12px; justify-items: center; }
  </style>
</head>
<body>
  <main class="fixture-grid">
    <aside class="graphic-timer graphic-widget expired"><span>Overtime</span><strong>-00:00.1</strong></aside>
    <aside class="graphic-timer graphic-widget expired"><span>Overtime</span><strong>-00:59.9</strong></aside>
    <aside class="graphic-timer graphic-widget expired"><span>Overtime</span><strong>-01:00.0</strong></aside>
    <aside class="graphic-timer graphic-widget expired"><span>Overtime</span><strong>-09:59.9</strong></aside>
    <aside class="graphic-timer graphic-widget expired"><span>Overtime</span><strong>-99:59.9</strong></aside>
  </main>
</body>
</html>
