<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Fixture responsive Portal Publico UX</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #20242b;
    }

    iframe {
      height: 844px;
      display: block;
      margin: 20px auto;
      border: 1px solid #596273;
      background: #090b10;
    }

    #mobile-live {
      width: 435px;
    }

    #mobile-sheet {
      width: 390px;
      height: 568px;
    }

    #mobile-program-390 {
      width: 390px;
      height: 844px;
    }

    #mobile-program-320 {
      width: 320px;
      height: 844px;
    }

    #mobile-home-360 {
      width: 360px;
      height: 800px;
    }

    #tablet-live-768 {
      width: 768px;
      height: 900px;
    }

    #tablet-results-1024 {
      width: 1024px;
      height: 900px;
    }

    #desktop-rankings-1280 {
      width: 1280px;
      height: 900px;
    }

    #desktop-results-1440 {
      width: 1440px;
      height: 900px;
    }

    #wide-home-1920 {
      width: 1920px;
      height: 1080px;
    }
  </style>
</head>
<body>
  <iframe
    id="mobile-live"
    title="Portal Publico En Vivo movil"
    src="./public-portal-ux.html?fixtureView=en-vivo"
  ></iframe>
  <iframe
    id="mobile-sheet"
    title="Sabana publica movil"
    src="./public-portal-ux.html?fixtureView=sabana"
  ></iframe>
  <iframe
    id="mobile-program-390"
    title="Programa publico movil 390"
    src="./public-portal-ux.html?fixtureView=programa"
  ></iframe>
  <iframe
    id="mobile-program-320"
    title="Programa publico movil 320"
    src="./public-portal-ux.html?fixtureView=programa"
  ></iframe>
  <iframe
    id="mobile-home-360"
    title="Inicio publico movil 360"
    src="./public-portal-ux.html?fixtureView=inicio&amp;scenario=long-content"
  ></iframe>
  <iframe
    id="tablet-live-768"
    title="Portal Publico En Vivo tableta 768"
    src="./public-portal-ux.html?fixtureView=en-vivo&amp;connection=stale"
  ></iframe>
  <iframe
    id="tablet-results-1024"
    title="Resultados publicos tableta 1024"
    src="./public-portal-ux.html?fixtureView=resultados"
  ></iframe>
  <iframe
    id="desktop-rankings-1280"
    title="Rankings publicos escritorio 1280"
    src="./public-portal-ux.html?fixtureView=competencias"
  ></iframe>
  <iframe
    id="desktop-results-1440"
    title="Resultados publicos escritorio 1440"
    src="./public-portal-ux.html?fixtureView=resultados"
  ></iframe>
  <iframe
    id="wide-home-1920"
    title="Inicio publico escritorio amplio 1920"
    src="./public-portal-ux.html?fixtureView=inicio"
  ></iframe>
</body>
</html>
